:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183341;background:#f3f8f8}*{box-sizing:border-box}body{margin:0}header{background:#075d67;color:white;padding:22px max(22px,calc((100vw - 1100px)/2));}header h1{margin:0;font-size:27px}header p{margin:6px 0;color:#d3eff0}main{max-width:1100px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 20px}button,select{font:inherit;border:1px solid #b5d0d2;border-radius:10px;padding:11px 15px;background:white;color:#174650;cursor:pointer}button:hover{border-color:#087985}button.primary,.active{background:#087985;color:white;border-color:#087985}.panel{background:white;border:1px solid #d9e9e9;border-radius:17px;padding:22px;margin:12px 0;box-shadow:0 4px 18px #0b53520a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{background:#e9f5f4;border-radius:12px;padding:15px}.stat b{font-size:25px;color:#006f77}.muted{color:#55727b}.eyebrow{color:#087985;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.title{font-size:24px;margin:8px 0 14px}.points{line-height:1.7}.points li{margin-bottom:8px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.flash{min-height:220px;border:2px solid #9fcac9;border-radius:17px;background:#f4fbfa;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer;white-space:pre-wrap;font-size:21px}.answer{border-left:4px solid #087985;background:#eff9f6;padding:14px;margin-top:14px;border-radius:7px}.wrong{border-left-color:#bb5b4d;background:#fff3f0}.choice{display:block;width:100%;text-align:left;margin:9px 0}.small{font-size:13px}.hide{display:none}progress{width:100%;height:15px;accent-color:#087985}footer{padding:20px;color:#627c81;text-align:center}input[type=range]{vertical-align:middle} @media(max-width:600px){header{padding:18px}main{padding:12px}.panel{padding:16px}}
.voice-settings{background:#eef8f8;border:1px solid #cce3e4;border-radius:13px;padding:15px;margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.voice-settings select{max-width:100%;min-width:240px}.voice-settings p{width:100%;margin:0}.voice-settings label{display:flex;align-items:center;gap:8px}@media(max-width:600px){.voice-settings{align-items:stretch;flex-direction:column}.voice-settings select{min-width:0;width:100%}}</style></head><body><header><h1>✦ RadTech Study Studio</h1><p>Pathology · Chapters 7 & 8 · Taught lessons → Recall → Test</p></header><main><nav id="nav"></nav><div id="app"></div></main><footer>Based on your instructor PowerPoints. Tutor narration uses voices installed in your browser or operating system. Google US English is preferred for spoken lessons when available in your browser.</footer><script>const TEACH=[{"ch": 7, "title": "Follow the urine: anatomy and function", "script": "Think of the urinary system as a filtering and drainage pathway. Blood enters the kidneys, where nephrons filter it. Urine then moves through collecting structures into the minor calyces, major calyces, and renal pelvis. It travels down the ureters into the bladder, which stores it, and finally exits through the urethra. Here is the important distinction: ureters connect kidneys to bladder, while the urethra carries urine outside the body. The kidneys lie behind the peritoneum, approximately between T12 and L3. When you see retroperitoneal on an exam, think kidneys.", "compare": "Ureter versus urethra", "question": "A patient has urine backing up between the kidney and bladder. Which tube is involved?", "answer": "Ureter", "why": "The ureter carries urine from kidney to bladder. The urethra carries it out of the body."}, {"ch": 7, "title": "Kidney function tests: BUN, creatinine and GFR", "script": "Before imaging the urinary tract, kidney function matters, particularly when iodinated contrast is considered. Creatinine is a waste product measured in blood. BUN measures blood urea nitrogen. GFR estimates how effectively kidneys filter blood; eGFR is a calculated estimate. Do not confuse a high creatinine with a high filtration rate. In general, reduced kidney filtration can raise creatinine and lower eGFR. A single number does not tell the whole clinical story, so the care team also considers the patient and current protocols.", "compare": "Creatinine versus eGFR", "question": "Which result more directly indicates reduced estimated kidney filtration: a lower eGFR or a lower creatinine?", "answer": "Lower eGFR", "why": "eGFR estimates filtration. Lower eGFR generally means reduced filtration; creatinine often rises as filtration worsens."}, {"ch": 7, "title": "KUB, IVU, cystography and VCUG", "script": "These exams sound similar, but follow where the contrast goes and what the study is meant to show. A KUB is a plain radiograph of kidneys, ureters and bladder, useful for some radiopaque stones and as a scout. In intravenous urography, contrast enters a vein and is excreted by the kidneys, outlining the urinary collecting system over time. In cystography, contrast is introduced retrograde into the bladder. A voiding cystourethrogram, or VCUG, specifically evaluates the bladder and urethra during urination and can show reflux. The deciding word is voiding. If a question says the patient urinates during imaging, think VCUG rather than routine cystography.", "compare": "Cystography versus VCUG", "question": "The bladder is filled with contrast, and images are obtained while the patient urinates. Which study is it?", "answer": "VCUG", "why": "The voiding phase distinguishes VCUG from routine cystography."}, {"ch": 7, "title": "Reflux, obstruction and hydronephrosis", "script": "Vesicoureteral reflux means urine flows backward from bladder toward the ureters and sometimes kidneys. Hydronephrosis means the renal collecting system becomes dilated because urine drainage is impaired. These can be related, but they are not identical. Reflux describes direction of flow; hydronephrosis describes dilation. A ureteral calculus can obstruct drainage and cause hydronephrosis. A staghorn calculus is a branching stone that fills part of the renal collecting system. If you see a branching stone, do not choose a bladder condition.", "compare": "VUR versus hydronephrosis", "question": "Imaging shows dilated renal calyces and pelvis from a blocked ureter. Which term best describes the kidney finding?", "answer": "Hydronephrosis", "why": "Hydronephrosis is dilation of the renal collecting system; VUR is backward urine flow."}, {"ch": 7, "title": "Kidney infections and bladder inflammation", "script": "The suffix itis means inflammation. Cystitis affects the urinary bladder; pyelonephritis affects the kidney, especially the renal pelvis and parenchyma. Both can involve urinary symptoms, but fever, flank pain, and systemic illness raise concern for upper urinary tract infection. Do not choose based only on painful urination. Find the location clue. In exam questions, ask whether the problem is in the bladder or the kidney.", "compare": "Cystitis versus pyelonephritis", "question": "A patient has fever and flank pain with a urinary infection. Which is more concerning?", "answer": "Pyelonephritis", "why": "Flank pain and fever suggest upper urinary tract involvement rather than isolated bladder inflammation."}, {"ch": 7, "title": "Congenital and neoplastic kidney conditions", "script": "Agenesis means an organ did not develop. A horseshoe kidney is a fusion anomaly, typically involving the lower poles. Polycystic kidney disease features multiple cysts and can be inherited; the slides mention PKD1 and PKD2. For tumors, distinguish renal cell carcinoma, a common malignant renal tumor in adults, from nephroblastoma, also called Wilms tumor, classically associated with childhood. The deciding clue can be patient age, not just the presence of a renal mass.", "compare": "RCC versus Wilms tumor", "question": "A young child has a renal mass. Which is the classic pediatric diagnosis?", "answer": "Wilms tumor", "why": "Wilms tumor is a pediatric renal malignancy, while renal cell carcinoma is more typical in adults."}, {"ch": 8, "title": "Brain, spinal cord and protective coverings", "script": "The central nervous system consists of the brain and spinal cord. The brain includes the cerebrum, cerebellum, diencephalon and brainstem. The brainstem contains the midbrain, pons and medulla. Three meninges protect the central nervous system: dura on the outside, arachnoid in the middle, and pia directly against the brain. A useful order is D A P, from outside inward. The brain also contains four interconnected ventricles that circulate cerebrospinal fluid. If the question says the meninges are inflamed, that is different from inflammation of the brain tissue itself.", "compare": "Meningitis versus encephalitis", "question": "Inflammation is in the protective membranes around the brain, not brain tissue. What is it?", "answer": "Meningitis", "why": "Meningitis affects meninges; encephalitis affects brain tissue."}, {"ch": 8, "title": "Brain circulation and stroke types", "script": "Anterior brain circulation comes largely from internal carotid arteries; posterior circulation from vertebral arteries, which join to form the basilar artery. The Circle of Willis connects major vessels. Stroke is broadly ischemic or hemorrhagic. Ischemic means reduced or blocked blood supply, commonly from a thrombus or embolus. Hemorrhagic means bleeding from a ruptured vessel. If the stem says an artery is blocked, think ischemic. If it says intracranial bleeding, think hemorrhagic. Those words matter more than shared symptoms such as weakness or headache.", "compare": "Ischemic versus hemorrhagic", "question": "CT shows acute intracranial bleeding after sudden neurological symptoms. Which stroke category fits?", "answer": "Hemorrhagic", "why": "Blood outside a ruptured vessel indicates hemorrhagic stroke, not an ischemic blockage."}, {"ch": 8, "title": "Hydrocephalus, meningitis and encephalitis", "script": "Hydrocephalus is abnormal buildup of cerebrospinal fluid in the ventricular system, often causing ventricular enlargement. Meningitis is inflammation of the meninges, while encephalitis is inflammation of brain tissue. These may all present with neurological symptoms, but the location and mechanism distinguish them. Ventricular enlargement points toward hydrocephalus. Meningeal irritation points toward meningitis. Brain parenchymal inflammation points toward encephalitis. Always identify the structure affected.", "compare": "Hydrocephalus versus encephalitis", "question": "Imaging shows enlarged ventricles due to excess cerebrospinal fluid. What is the finding?", "answer": "Hydrocephalus", "why": "The clue is CSF accumulation in ventricles, not inflammation of brain tissue."}, {"ch": 8, "title": "Multiple sclerosis and imaging choices", "script": "Multiple sclerosis is a demyelinating disease of the central nervous system. Myelin is the insulating covering that helps nerve signals travel efficiently. Damage to it disrupts communication. The instructor slides emphasize MRI for evaluating demyelinating diseases. CT can be very important in acute brain evaluation, especially suspected hemorrhage, but MRI is better suited to characterizing many demyelinating lesions. If the question says plaques or demyelination, look for MS and MRI.", "compare": "MS versus acute hemorrhage", "question": "A patient is being evaluated for suspected CNS demyelinating plaques. Which imaging modality is emphasized?", "answer": "MRI", "why": "MRI is the key modality emphasized for multiple sclerosis and demyelinating lesions."}, {"ch": 8, "title": "Herniated disc and neurologic compression", "script": "An intervertebral disc has an outer annulus fibrosus and a softer inner nucleus pulposus. Herniation occurs when disc material pushes beyond its normal boundary and can compress neural structures. Common sites in your slides include L5 to S1 and C6 to C7. A disc problem is different from a problem in the brain ventricles or meninges. On an exam, look for radicular pain, the spinal level, and whether nerve roots are compressed.", "compare": "Annulus versus nucleus", "question": "Which is the soft inner material of an intervertebral disc?", "answer": "Nucleus pulposus", "why": "The nucleus pulposus is central; the annulus fibrosus is the outer ring."}, {"ch": 8, "title": "Brain tumors: distinguish by clues", "script": "A meningioma arises from the meninges and is often slow-growing and benign. A schwannoma arises from Schwann cells; vestibular schwannoma is often called acoustic neuroma. Medulloblastoma is a malignant brain tumor. Metastatic brain tumors spread from another primary cancer, commonly including lung cancer. A mass alone is not enough to identify the tumor. Ask: is it meningeal, nerve-associated, malignant, or a metastasis? Patient age and location can also be clues.", "compare": "Meningioma versus schwannoma", "question": "A slow-growing tumor arises from the meninges. Which diagnosis fits best?", "answer": "Meningioma", "why": "Meningioma is associated with the meninges; schwannoma is nerve-sheath derived."}] ;let teachIndex=0,teachReveal=false;function renderTeaching(){let pool=TEACH.filter(x=>x.ch===chapter);if(teachIndex>=pool.length)teachIndex=0;let t=pool[teachIndex];document.getElementById("app").innerHTML=selector()+`<section class="panel"><div class="eyebrow">Narrated teaching · Lesson ${teachIndex+1} of ${pool.length}</div><h2 class="title">${esc(t.title)}</h2><p class="muted">An actual explanation, not a slide reading. Play, pause, and replay as needed.</p><div class="answer" style="line-height:1.8;font-size:17px">${esc(t.script)}</div><div class="controls"><button class="primary" onclick="say('Welcome back. Today we are learning: '+TEACH.filter(x=>x.ch===chapter)[teachIndex].title+'. First, listen for the deciding clues. '+TEACH.filter(x=>x.ch===chapter)[teachIndex].script+' Now, here is a common exam trap: '+TEACH.filter(x=>x.ch===chapter)[teachIndex].compare+'. Think about what is different between these conditions. I have a question for you. '+TEACH.filter(x=>x.ch===chapter)[teachIndex].question+' Pause and answer it out loud before you reveal the explanation.')">▶ Start instructor lesson</button></div>${voiceOptions()}<h3>Two answers that can look alike</h3><p><b>${esc(t.compare)}</b></p><h3>Check understanding</h3><p>${esc(t.question)}</p><button onclick="teachReveal=!teachReveal;renderTeaching()">${teachReveal?'Hide':'Show'} explanation</button>${teachReveal?`<div class="answer"><b>${esc(t.answer)}</b><p>${esc(t.why)}</p><button onclick="say(TEACH.filter(x=>x.ch===chapter)[teachIndex].why)">▶ Hear why</button></div>`:''}<div class="controls"><button onclick="stop();teachIndex=Math.max(0,teachIndex-1);teachReveal=false;renderTeaching()">← Previous</button><button class="primary" onclick="stop();teachIndex=Math.min(TEACH.filter(x=>x.ch===chapter).length-1,teachIndex+1);teachReveal=false;renderTeaching()">Next lesson →</button></div></section>`}

let flashAutoRead=false;function speakFlashcard(which){let deck=D.cards.filter(x=>x.ch===chapter&&(!reviewOnly||done[chapter+':'+x.front]==='miss'));let c=deck[cardIndex];if(!c)return;let phrase=which==='front'?'Question. '+c.front:which==='back'?'Answer. '+c.back:'Question. '+c.front+'. The answer is: '+c.back;say(phrase)}function flipFlashcard(){flipped=!flipped;render();if(flashAutoRead)speakFlashcard(flipped?'back':'front')}function choose(m){stop();mode=m;render()}function nav(){let names=[['home','Dashboard'],['teaching','🎙️ Tutor teaches'],['lessons','Slide review'],['cards','Flashcards'],['quiz','Practice quiz'],['exam','Mock exam'],['plan','Study plan']];$('nav').innerHTML=names.map(([k,v])=>`<button class="${mode===k?'active':''}" onclick="choose('${k}')">${v}</button>`).join('')}function selector(){return `<div class="controls"><button class="${chapter===7?'primary':''}" onclick="chapter=7;slideIndex=0;cardIndex=0;teachIndex=0;render()">Chapter 7 · Urinary</button><button class="${chapter===8?'primary':''}" onclick="chapter=8;slideIndex=0;cardIndex=0;teachIndex=0;render()">Chapter 8 · CNS</button></div>`}function render(){nav();if(mode==='teaching'){renderTeaching();return}let h='';if(mode==='home'){h=`<section class="panel"><div class="eyebrow">Your exam prep home</div><h2 class="title">Study smarter, not just longer.</h2><p>Start with the Tutor Teaches mode for a real narrated explanation. Close the notes and explain the concept out loud. Then use flashcards and a short quiz. Finish with a mixed mock exam.</p><div class="grid"><div class="stat"><b>112</b><div>Instructor slides</div></div><div class="stat"><b>${D.cards.length}</b><div>Study flashcards</div></div><div class="stat"><b>${D.questions.length}</b><div>Practice questions</div></div><div class="stat"><b>${Object.keys(done).length}</b><div>Cards marked reviewed</div></div></div></section><section class="panel"><h3>Today's study sequence</h3><ol class="points"><li>Listen to a tutor lesson and pause to explain the concept back.</li><li>Say what it means in your own words without looking.</li><li>Flip 10 flashcards and mark what you missed.</li><li>Take a 10-question quiz; review every missed explanation.</li><li>Repeat missed material the next day, then take a mixed exam.</li></ol></section>`}if(mode==='lessons'){let s=ch().slides[slideIndex];let spoken=`Chapter ${chapter}, slide ${s.page}. ${s.title}. ${s.points.join('. ')}. Pause now and explain the key ideas aloud in your own words.`;h=`${selector()}<section class="panel"><div class="eyebrow">Audio lesson · Slide ${s.page} of ${ch().slides.length}</div><h2 class="title">${esc(s.title)}</h2><p class="muted">Instructor slide ${s.page}. Use the play button to hear the lesson, then teach it back from memory.</p><ul class="points">${s.points.length?s.points.map(p=>`<li>${esc(p)}</li>`).join(''):'<li>This is primarily a visual or image-based slide. Review the original PowerPoint image.</li>'}</ul><div class="controls"><button class="primary" data-audio="slide">▶ Listen to slide</button></div>${voiceOptions()}<div class="controls"><button onclick="say('Hello! I am your RadTech instructor. If you can hear this, slide audio is working.')">🔊 Test sound</button></div><div class="answer"><b>Teach-back prompt:</b> Without reading, explain the topic and name two facts from this slide. If you cannot, replay it before moving on.</div><div class="controls"><button onclick="slideIndex=Math.max(0,slideIndex-1);render()">← Previous</button><button class="primary" onclick="slideIndex=Math.min(ch().slides.length-1,slideIndex+1);render()">Next slide →</button><select onchange="slideIndex=Number(this.value);render()">${ch().slides.map((x,i)=>`<option value="${i}" ${i===slideIndex?'selected':''}>${x.page}: ${esc(x.title.slice(0,50))}</option>`).join('')}</select></div></section>`}if(mode==='cards'){let deck=D.cards.filter(x=>x.ch===chapter&&(!reviewOnly||done[chapter+':'+x.front]==='miss'));if(cardIndex>=deck.length)cardIndex=0;let c=deck[cardIndex];h=`${selector()}<section class="panel"><div class="eyebrow">Active recall · ${deck.length?cardIndex+1:0} of ${deck.length}</div><h2>Flashcards</h2><label><input type="checkbox" ${reviewOnly?'checked':''} onchange="reviewOnly=this.checked;cardIndex=0;flipped=false;render()"> Review only cards I missed</label>${c?`<div class="flash" onclick="flipFlashcard()"><div><div class="eyebrow">${flipped?'Answer':'Question'}</div><div style="margin-top:14px">${esc(flipped?c.back:c.front)}</div></div></div><p class="muted small">Tap the card to ${flipped?'see the question':'reveal the answer'}</p>${flipped&&c.explanation?`<div class="answer"><b>Why it matters:</b> ${esc(c.explanation)}</div>`:''}<label><input type="checkbox" ${flashAutoRead?'checked':''} onchange="flashAutoRead=this.checked"> Automatically speak when I flip a card</label>${voiceOptions()}<div class="controls"><button onclick="done[chapter+':'+${JSON.stringify(c.front)}]='miss';save();nextCard()">✕ Need review</button><button class="primary" onclick="done[chapter+':'+${JSON.stringify(c.front)}]='know';save();nextCard()">✓ I know this</button><button data-audio="card-front">🔊 Hear question</button><button data-audio="card-back">🔊 Hear answer</button><button data-audio="card-both">▶ Read both</button><button onclick="nextCard()">Skip →</button></div>`:'<p>No missed cards here. Turn off the missed-only filter to see all cards.</p>'}</section>`}if(mode==='quiz'||mode==='exam'){if(!quiz.length)startQuiz();if(qi>=quiz.length){h=`<section class="panel"><h2>Quiz complete!</h2><div class="stat"><b>${correct}/${quiz.length} (${Math.round(100*correct/quiz.length)}%)</b></div><div class="controls"><button class="primary" data-audio="quiz-results">▶ Hear results and review</button></div>${voiceOptions()}<h3>Questions to review</h3>${missed.length?missed.map(x=>`<p><b>${esc(x.q)}</b><br>${esc(x.a)} — ${esc(x.why)}</p>`).join(''):'<p>Excellent—no missed questions this round.</p>'}<button class="primary" onclick="startQuiz(true);render()">Try another round</button></section>`}else{let item=quiz[qi];let opts=shuffle([...item.opts]);if(!item.display)item.display=opts;h=`${mode==='quiz'?selector():''}<section class="panel"><div class="eyebrow">${mode==='exam'?'Mixed mock exam':'Chapter '+chapter+' quiz'} · Question ${qi+1}/${quiz.length}</div><progress value="${qi}" max="${quiz.length}"></progress><h2 class="title">${esc(item.q)}</h2>${item.display.map((o,i)=>`<button class="choice" ${answered?'disabled':''} onclick="answer(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}<div id="feedback"></div>${voiceOptions()}<div class="controls"><button data-audio="quiz-question">▶ Hear question</button><button id="nextQ" class="primary hide" onclick="qi++;answered=false;render()">Next question →</button></div></section>`}}if(mode==='plan'){h=`<section class="panel"><h2>Exam-week study plan</h2><div class="controls"><button class="primary" data-audio="study-plan">▶ Listen to study plan</button></div>${voiceOptions()}<p><b>Pathology:</b> Chapter 7 + 8 audio, flashcards and a timed mixed quiz before your intended Friday test.</p><p><b>Positioning:</b> Target Thursday or Friday; add your positioning materials for projection-specific drills.</p><p><b>Physics:</b> Target Saturday; add your physics chapters for formula and scenario practice.</p><p class="muted">Your stated dates are goals, not verified course deadlines. Check the LMS before scheduling exams.</p><h3>Suggested daily routine</h3><p>25 minutes audio and teach-back → 10-minute break → 20 minutes flashcards → 20 minutes quizzes → 10 minutes reviewing mistakes.</p></section>`}$('app').innerHTML=h}function speakQuizQuestion(){let item=quiz[qi];if(!item)return;let choices=item.display||item.opts||[];say('Question '+(qi+1)+' of '+quiz.length+'. '+item.q+'. Your choices are. '+choices.map((c,i)=>'Option '+('ABCD'[i])+'. '+c+'.').join(' ')+' Choose the best answer.')}function speakQuizAnswer(){let item=quiz[qi];if(item)say('The correct answer is '+item.a+'.')}function speakQuizExplanation(){let item=quiz[qi];if(item)say('The correct answer is '+item.a+'. Here is why. '+item.why+'. Remember the deciding clue before moving on.')}function speakQuizResults(){let intro='You completed '+quiz.length+' questions and answered '+correct+' correctly. ';let details=missed.length?'Review these missed questions. '+missed.map((x,i)=>'Missed question '+(i+1)+'. '+x.q+'. Correct answer: '+x.a+'. Explanation: '+x.why+'.').join(' '):'Excellent. You did not miss any questions in this round.';say(intro+details)}function speakStudyPlan(){say('Here is your exam week study plan. First, Pathology. Study chapters seven and eight with audio lessons, flashcards, and practice questions before your intended Friday exam. Next, Positioning. Your target is Thursday or Friday. Add your positioning materials to practice projection-specific questions and image analysis. Then Physics. Your target is Saturday. Add your physics chapters to practice formulas and clinical scenarios. These are your study goals, not verified school deadlines, so check your learning management system. For each study session, spend twenty-five minutes listening and teaching back the topic. Take a ten-minute break. Spend twenty minutes on flashcards. Spend twenty minutes on quiz questions. Finish with ten minutes reviewing mistakes. Remember: understand the deciding clue, not just the definition.')}function nextCard(){stop();cardIndex++;flipped=false;render()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startQuiz(force=false){quiz=shuffle(D.questions.filter(x=>mode==='exam'||x.ch===chapter)).slice(0,mode==='exam'?D.questions.length:10).map(x=>({...x}));qi=0;correct=0;missed=[];answered=false}function answer(i){if(answered)return;answered=true;let x=quiz[qi],chosen=x.display[i],ok=chosen===x.a;if(ok)correct++;else missed.push(x);$('feedback').innerHTML=`<div class="answer ${ok?'':'wrong'}"><b>${ok?'Correct!':'Not quite.'}</b><p>Answer: ${esc(x.a)}</p><p>${esc(x.why)}</p><p class="small">Instructor slide ${x.slide}</p><button data-audio="quiz-explanation">▶ Hear explanation</button><button data-audio="quiz-answer">🔊 Hear correct answer</button></div>`;$('nextQ').classList.remove('hide')}
// Shared audio event handler: one reliable entry point for all study modes.
document.addEventListener('click',function(event){
 const button=event.target.closest('button[data-audio]');if(!button)return;
 event.preventDefault();
 const action=button.dataset.audio;
 updateAudioStatus('Audio button clicked: '+action+'. Starting…');
 try{
  const handlers={'slide':playCurrentSlide,'card-front':()=>speakFlashcard('front'),'card-back':()=>speakFlashcard('back'),'card-both':()=>speakFlashcard('both'),'quiz-question':speakQuizQuestion,'quiz-explanation':speakQuizExplanation,'quiz-answer':speakQuizAnswer,'quiz-results':speakQuizResults,'study-plan':speakStudyPlan};
  if(!handlers[action])throw Error('Unknown audio action');
  handlers[action]();
 }catch(error){updateAudioStatus('Audio button error: '+error.message);console.error('Audio button error',error)}
});
render();</script></body></html>
